name: Labels

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check:
    name: Check labels.yml is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate labels.yml and repository coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/sync-labels.sh --check
