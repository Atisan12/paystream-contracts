[package]
name = "paystream-token-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# Proptest fuzz targets for the token contract (TOK-19). Each target drives the
# real contract through `TokenContractClient` in a fresh `Env` per case and
# checks supply/balance/allowance invariants. Run with
#   cargo test --package paystream-token-fuzz --bin <target>
# Case count: PROPTEST_CASES (default 256 per property).

[dependencies]
paystream-token = { path = "..", features = ["testutils"] }
proptest = "1"
soroban-sdk = { version = "29.0.1", features = ["testutils"] }

[[bin]]
name = "fuzz_transfer"
path = "src/fuzz_transfer.rs"

[[bin]]
name = "fuzz_allowance"
path = "src/fuzz_allowance.rs"

[[bin]]
name = "fuzz_mint_burn"
path = "src/fuzz_mint_burn.rs"
