[package]
name = "paystream-stream-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
paystream-stream = { path = "..", features = ["testutils"] }
paystream-token = { path = "../../token", features = ["testutils"] }
proptest = "1"
soroban-sdk = { version = "29.0.1", features = ["testutils"] }

[[bin]]
name = "fuzz_claimable"
path = "src/fuzz_claimable.rs"

[[bin]]
name = "fuzz_withdraw"
path = "src/fuzz_withdraw.rs"

[[bin]]
name = "fuzz_create_stream"
path = "src/fuzz_create_stream.rs"

[[bin]]
name = "fuzz_admin_nonce"
path = "src/fuzz_admin_nonce.rs"

[[bin]]
name = "fuzz_batch_create"
path = "src/fuzz_batch_create.rs"

[[bin]]
name = "fuzz_batch_cancel"
path = "src/fuzz_batch_cancel.rs"

[[bin]]
name = "prop_claimable_invariant"
path = "src/prop_claimable_invariant.rs"
